[project]
name = "nextdoorads-mcp"
version = "0.1.0"
description = "MCP server for the Nextdoor Ads API"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28.1,<0.29",
    "mcp>=2.3,<3",
]

[project.scripts]
nextdoorads-mcp-setup = "nextdoorads_mcp.setup:setup"
nextdoorads-mcp-verify = "nextdoorads_mcp.setup:verify"
nextdoorads-mcp = "nextdoorads_mcp.server:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22,<0.23",
    "ruff>=0.12,<0.13",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
